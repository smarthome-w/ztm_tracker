name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install lint dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install ruff

            - name: Run Python lint
              run: ruff check .

            - name: Install test dependencies
              run: |
                  pip install pytest pytest-asyncio homeassistant async_timeout

            - name: Run unit tests
              run: pytest -q tests/test_coordinator.py tests/test_config_flow.py
