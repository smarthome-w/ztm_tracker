name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read
    pull-requests: read

jobs:
    markdown_changes:
        runs-on: ubuntu-latest
        outputs:
            markdown_changed: ${{ steps.filter.outputs.md }}
        steps:
            - uses: actions/checkout@v5

            - id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      md:
                        - '**/*.md'

    markdown_lint:
        needs: markdown_changes
        if: needs.markdown_changes.outputs.markdown_changed == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Run markdown lint
              uses: DavidAnson/markdownlint-cli2-action@v20
              with:
                  globs: "**/*.md"

    python_checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install lint dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install ruff

            - name: Run Python lint
              run: ruff check .

            - name: Install test dependencies
              run: |
                  pip install pytest pytest-asyncio homeassistant async_timeout

            - name: Run unit tests
              run: pytest -q tests/test_coordinator.py tests/test_config_flow.py
